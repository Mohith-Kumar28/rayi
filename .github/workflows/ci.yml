name: CI

on:
  push:
    branches: [main]
  pull_request:

# A money system: never run two deploys of the same ref concurrently, and never
# cancel a run halfway through in a way that leaves a partial state.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm turbo run typecheck test

      # The ledger invariants are properties of PostgreSQL, not of our code — the
      # non-negative CHECK, the deferred balanced-entry trigger, append-only
      # enforcement and the concurrency behaviour. A mocked database would assert
      # only that the mock behaves like the mock, so these run against a real one.
      - name: Start PostgreSQL for ledger integration tests
        run: |
          docker run -d --name rayi-pg \
            -e POSTGRES_PASSWORD=rayi -e POSTGRES_USER=rayi -e POSTGRES_DB=rayi \
            -p 55432:5432 postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec rayi-pg pg_isready -U rayi && break
            sleep 1
          done

      # Through the guarded entrypoint, so CI exercises the same path a deploy
      # takes — including the checks that Prisma's migration advisory lock has
      # not been disabled and is not being taken through a transaction-mode pooler.
      - name: Apply migrations
        run: pnpm --filter @rayi/backend migrate:deploy
        env:
          DATABASE_URL: postgresql://rayi:rayi@localhost:55432/rayi

      # `migrate deploy` applies the committed migrations; `migrate diff` then
      # asserts the schema they produce is the schema Prisma would generate from
      # schema.prisma. Without this, a hand-written migration and the schema file
      # can disagree indefinitely — and several of ours are hand-written, because
      # generated columns, deferred constraint triggers, REVOKE and SECURITY
      # DEFINER functions are not expressible in Prisma.
      - name: Assert migrations and schema agree
        run: |
          pnpm --filter @rayi/backend exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel apps/backend/prisma/schema.prisma \
            --exit-code && echo "schema matches" || {
              echo "::error::prisma/schema.prisma and the migrations have diverged."
              exit 1
            }
        env:
          DATABASE_URL: postgresql://rayi:rayi@localhost:55432/rayi

      - name: Integration tests (ledger, authorization, treasury, HTTP)
        run: pnpm --filter @rayi/backend test:it
        env:
          LEDGER_TEST_DATABASE_URL: postgresql://rayi:rayi@localhost:55432/rayi
          DATABASE_URL: postgresql://rayi:rayi@localhost:55432/rayi

      # The drift gate. Changing a contract without regenerating the spec fails
      # here rather than shipping a document that disagrees with the server.
      - name: Verify openapi.json matches the manifest
        run: pnpm --filter @rayi/contracts verify:openapi

      # The generated client must match the committed spec too — otherwise the
      # frontend is typed against something the backend does not serve.
      - name: Verify the generated client is up to date
        run: |
          pnpm --filter @rayi/api-client generate
          if ! git diff --quiet -- packages/api-client/src/generated; then
            echo "::error::The generated API client is out of date."
            echo "Run: pnpm contracts"
            git diff --stat -- packages/api-client/src/generated
            exit 1
          fi

      # The set of internet-reachable Better Auth endpoints. Better Auth is mounted
      # as a catch-all, so a new endpoint in a patch release becomes reachable the
      # moment the lockfile changes — with no code review of ours in the path.
      - name: Verify the Better Auth surface has not changed
        run: pnpm --filter @rayi/backend verify:auth-surface

      # Module boundaries. Nest's encapsulation is a DI boundary, not an import
      # boundary — this is what actually stops a controller reaching the treasury.
      - name: Check module boundaries
        run: pnpm --filter @rayi/backend depcruise

      - name: Build
        run: pnpm turbo run build
